# Installed as /etc/junkyard/junkyard.toml; contains no credentials.
public_url = "https://files.example.com"
data_dir = "/var/lib/junkyard"
bind_host = "127.0.0.1"
bind_port = 8000
trusted_proxies = ["127.0.0.1"]
# Keep this equal to client_max_body_size in nginx.conf (bytes).
max_file_bytes = 262144000
storage_quota_bytes = 107374182400
max_transfers = 4
