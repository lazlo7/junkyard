# Complete configuration for a dedicated Nginx instance. Adapt the worker
# account, hostname, and certificate paths before installation.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
# Nginx error messages can contain request URLs and cannot be safely reformatted.
# Deliberate tradeoff: retain safe access records, suppress unredacted errors.
error_log /dev/null;

events { worker_connections 1024; }

http {
    server_tokens off;
    log_format junkyard_private escape=json
        '{"time":"$time_iso8601","event":"proxy_request",'
        '"request_id":"$request_id","app_request_id":"$upstream_http_x_request_id",'
        '"status":$status,"duration_seconds":$request_time}';
    access_log /var/log/nginx/junkyard-access.log junkyard_private;

    # Reject plain HTTP rather than redirecting credentials or request bodies.
    server {
        listen 80 default_server;
        server_name _;
        return 400;
    }

    server {
        listen 443 ssl default_server;
        server_name files.example.com;
        ssl_certificate /etc/ssl/junkyard/fullchain.pem;
        ssl_certificate_key /etc/ssl/junkyard/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($host != files.example.com) { return 421; }

        # Exactly 250 MiB; keep equal to max_file_bytes in junkyard.toml.
        client_max_body_size 262144000;
        client_body_buffer_size 64k;
        client_header_timeout 15s;
        client_body_timeout 60s;
        send_timeout 60s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Proxy-Request-ID $request_id always;

        # Every path reaches the application. Never add a storage root/alias.
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host files.example.com;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Request-ID "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_redirect off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
